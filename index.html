<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aion 2 Armory</title>
  <link rel="icon" href="assets/class_icons/gladiator.png">
  <script>
    // Set before the stylesheets apply so a light-theme visit never flashes dark; js/theme.js takes over once loaded.
    try {
      var theme = (JSON.parse(localStorage.getItem("aion2-armory-ui") || "{}").theme) || "system";
      if (theme !== "dark" && theme !== "light") theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = theme;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/widgets.css">
  <link rel="stylesheet" href="css/skills.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/daevanion.css">
  <link rel="stylesheet" href="css/equipment.css">
  <link rel="stylesheet" href="css/arcana.css">
  <link rel="stylesheet" href="css/pantheon.css">
  <link rel="stylesheet" href="css/genius.css">
  <link rel="stylesheet" href="css/builds.css">
  <link rel="stylesheet" href="css/checklist.css">
  <link rel="stylesheet" href="css/timers.css">
  <link rel="stylesheet" href="css/characters.css">
  <link rel="stylesheet" href="css/alerts.css">
  <link rel="stylesheet" href="css/official.css">
</head>
<body>
  <nav id="sidebar">
    <h1>Tools</h1>
    <div id="tools" class="stack"></div>
    <h1 class="side-title">Characters</h1>
    <div class="muted small">Click a character to switch the Armory to it.</div>
    <div id="roster"></div>
    <div class="row" style="margin-top:4px">
      <button id="add-character" class="grow">Add character</button>
    </div>
    <div class="row">
      <button id="import-official" class="grow" title="Search a character on aion2.plaync.com and import its equipment, skill levels and Daevanion boards">Import from aion2.plaync.com</button>
      <button id="sync-official" title="Sync every roster character with aion2.plaync.com: linked ones directly, the others by name on your default server">Sync all</button>
    </div>
    <div class="row">
      <button id="export-images" class="grow" title="Daevanion boards, skills and skill layout of the current character as PNG images in one zip">Export images</button>
    </div>
    <div class="side-foot">
      <div class="row">
        <button id="export-profile" class="link" type="button">Export profile</button><span class="sep">·</span>
        <button id="import-profile" class="link" type="button">Import profile</button>
        <span class="grow"></span>
        <button id="open-settings" type="button" title="Settings" aria-label="Settings"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="2.4"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>Settings</button>
      </div>
      <input id="import-file" type="file" accept="application/json" hidden>
      <div class="muted small">Your profile is stored in this browser. Export it to keep a copy or to move it to another browser or device.</div>
    </div>
  </nav>
  <div id="main-col">
    <div id="dock-top" class="wa-dock-host"></div>
    <main id="main"></main>
    <div id="dock-bottom" class="wa-dock-host"></div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
